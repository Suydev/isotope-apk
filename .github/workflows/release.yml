name: 🚀 Release

on:
  push:
    branches:
      - main
  tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: isotope-apk
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      # ── Checkout this repo (Capacitor wrapper + bridge + prebuilt www/) ─────
      - name: ⬇️ Checkout isotope-apk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: isotope-apk

      - name: 🏷️ Resolve version & tag
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./package.json').version" 2>/dev/null || echo "")"
            if [ -z "$VERSION" ]; then
              echo "❌ Could not read version from package.json"
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'; then
            echo "❌ Invalid version: $VERSION"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: isotope-apk/package-lock.json

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: 📦 Install Android SDK Build Tools & Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: 📥 Install npm dependencies
        run: npm ci

      - name: ✅ Run regression tests
        run: npm test

      - name: ✅ Syntax checks
        run: |
          set -euo pipefail
          node --check android-bridge.js
          node --check android-floating-timer-bridge.js
          node --check scripts/prepare-www.js
          node --check scripts/apply-android-patches.js

      # ── Apply Android patches to the committed www/ ────────────────────────
      - name: 🩹 Apply Android bundle and native patches
        env:
          WWW_DIR: ${{ github.workspace }}/isotope-apk/www
          ANDROID_DIR: ${{ github.workspace }}/isotope-apk/android
        run: node scripts/apply-android-patches.js

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🩹 Re-apply native patches after Capacitor sync
        env:
          WWW_DIR: ${{ github.workspace }}/isotope-apk/www
          ANDROID_DIR: ${{ github.workspace }}/isotope-apk/android
        run: node scripts/apply-android-patches.js

      - name: 🔧 Make Gradle wrapper executable
        run: chmod +x android/gradlew

       # ── Release signing ────────────────────────────────────────────────────
      # Decode the release keystore from GitHub secrets and expose signing env
      # vars. build.gradle signs the release APK with this keystore; if the
      # secrets are absent the release build fails clearly (no debug fallback).
      - name: 🔑 Configure release signing (from GitHub secrets)
        if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "KEYSTORE_FILE=${PWD}/android/app/release.keystore"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "✅ Release keystore configured"
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not set — release build will fail to sign"
          fi

      - name: 🏗️ Build Android APK
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BUILD_TYPE=release
          else
            BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Building RELEASE APK..."
            android/gradlew -p android assembleRelease --no-daemon --stacktrace
          else
            echo "Building DEBUG APK..."
            android/gradlew -p android assembleDebug --no-daemon --stacktrace
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: 🔎 Locate & rename built APK
        id: apk
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BUILD_TYPE=release
          else
            BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH=$(find android -name "*.apk" -path "*release*" -type f | head -1)
          else
            APK_PATH=$(find android -name "*.apk" -path "*debug*" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found after build"
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          RENAMED="IsotopeAI-v${VERSION}-${BUILD_TYPE}.apk"
          cp "$APK_PATH" "$RENAMED"
          echo "path=${RENAMED}" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1)) → $RENAMED"

      # ── Release notes ──────────────────────────────────────────────────────
      - name: 📋 Extract changelog section (if CHANGELOG.md exists)
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          else
            NOTES=""
          fi
          if [ -z "$NOTES" ]; then
            NOTES="See the commit history for what's changed in this build."
          fi
          echo "$NOTES" > /tmp/changelog_notes.txt
          {
            echo "notes<<CHANGELOG_EOF"
            cat /tmp/changelog_notes.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📝 Build release notes
        run: |
          cat > /tmp/release_notes.md <<EOF
          ## IsotopeAI Android ${{ steps.version.outputs.tag }}

          ${{ steps.changelog.outputs.notes }}

          ---

          ### 📱 Install
          Download \`IsotopeAI-v${{ steps.version.outputs.version }}-${{ github.event.inputs.build_type || 'debug' }}.apk\` below and
          install it on your Android device (Android 8.0+). You may need to allow
          "install from unknown sources" for your browser/file manager.

          ### 🧩 Built from
          - isotope-apk @ \`${{ github.sha }}\`

          ### ❤️ Support
          UPI: \`9699393886@fam\` · [isotopeai.in](https://isotopeai.in)
          EOF

      - name: 🏷️ Ensure release tag points to this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: 🎉 Create or update GitHub Release
        if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          PRERELEASE_FLAG=()
          if printf '%s' "$TAG" | grep -Eq -- '(-beta|-rc)'; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "IsotopeAI Android ${TAG}" \
              --notes-file /tmp/release_notes.md \
              "${PRERELEASE_FLAG[@]}"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "IsotopeAI Android ${TAG}" \
              --notes-file /tmp/release_notes.md \
              "${PRERELEASE_FLAG[@]}"
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "✅ Release ${TAG} published with ${APK}"
