name: Build Android APK (Legacy)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Build Tools & Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Sync bridge for test harness
        run: |
          if [ -f www/android-bridge.js ]; then
            cp www/android-bridge.js android-bridge.js
            echo "Synced android-bridge.js root <- www/android-bridge.js"
          fi

      - name: Run regression tests
        run: npm test

      - name: Validate www/ JS syntax
        run: |
          node -e '
            const fs=require("fs");
            const {execSync}=require("child_process");
            function walk(d){let r=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=d+"/"+e.name;if(e.isDirectory())r=r.concat(walk(p));else if(e.name.endsWith(".js"))r.push(p);}return r;}
            const files=walk("www");const bad=[];
            for(const f of files){try{execSync("node --check "+JSON.stringify(f),{stdio:"ignore"});}catch(e){bad.push(f);}}
            if(bad.length){console.error("CORRUPTED JS FILES:\n"+bad.join("\n"));process.exit(1);}
            console.log("All www/ JS files valid ("+files.length+" files checked)");
          '

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isotopeai-debug-apk-legacy-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
