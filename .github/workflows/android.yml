name: Build Android APK

on:
  push:
    branches: [main, codex/android-production-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout this repo (Capacitor wrapper + bridge + prebuilt www/) ──────
      - name: Checkout isotope-apk
        uses: actions/checkout@v4
        with:
          path: isotope-apk

      # ── Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: isotope-apk/package-lock.json

      # ── Java setup ────────────────────────────────────────────────────────
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Build Tools & Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── Install npm dependencies ──────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: isotope-apk
        run: npm ci

      - name: Run regression tests
        working-directory: isotope-apk
        run: npm test

      # ── Report www/ size (prebuilt, committed) ───────────────────────────
      - name: Report www/ size
        working-directory: isotope-apk
        run: |
          echo "=== www/ top-level ==="
          ls -lh www/
          echo ""
          echo "=== Total size ==="
          du -sh www/
          echo ""
          echo "=== index.html bridge injection check ==="
          head -10 www/index.html
          echo ""
          echo "=== Largest files ==="
          find www/ -type f -printf '%s %p\n' | sort -rn | head -20 | awk '{printf "%.1f MB  %s\n", $1/1024/1024, $2}'

      # ── Apply Android patches ─────────────────────────────────────────────
      # Patches JS bundles in www/assets/ and validates native Android config
      - name: Apply Android bundle and native patches
        working-directory: isotope-apk
        env:
          WWW_DIR: ${{ github.workspace }}/isotope-apk/www
          ANDROID_DIR: ${{ github.workspace }}/isotope-apk/android
        run: node scripts/apply-android-patches.js

      # ── Sync Capacitor ────────────────────────────────────────────────────
      - name: Sync Capacitor
        working-directory: isotope-apk
        run: npx cap sync android

      - name: Re-apply native patches after Capacitor sync
        working-directory: isotope-apk
        env:
          WWW_DIR: ${{ github.workspace }}/isotope-apk/www
          ANDROID_DIR: ${{ github.workspace }}/isotope-apk/android
        run: node scripts/apply-android-patches.js

      # ── Validate www/ JS syntax (fail build if any bundle is corrupted) ──────
      - name: Validate www/ JS syntax
        working-directory: isotope-apk
        run: |
          node -e '
            const fs=require("fs");
            const {execSync}=require("child_process");
            function walk(d){let r=[];for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=d+"/"+e.name;if(e.isDirectory())r=r.concat(walk(p));else if(e.name.endsWith(".js"))r.push(p);}return r;}
            const files=walk("www");const bad=[];
            for(const f of files){try{execSync("node --check "+JSON.stringify(f),{stdio:"ignore"});}catch(e){bad.push(f);}}
            if(bad.length){console.error("CORRUPTED JS FILES (build must not ship these):\n"+bad.join("\n"));process.exit(1);}
            console.log("All www/ JS files valid ("+files.length+" files checked)");
          '

      # ── Make Gradle executable ────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        working-directory: isotope-apk/android
        run: chmod +x gradlew

      # ── Build Debug APK ───────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: isotope-apk
        run: android/gradlew -p android assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      # ── Find and report APK ───────────────────────────────────────────────
      - name: Find APK and report size
        working-directory: isotope-apk
        run: |
          echo "=== Built APK(s) ==="
          find android -name "*.apk" -type f | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "  $size  $f"
          done

      # ── Upload APK artifact ───────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IsotopeAI-debug-${{ github.run_number }}
          path: isotope-apk/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── Upload build logs on failure ──────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            isotope-apk/android/app/build/reports/
            isotope-apk/android/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # Optional: release build (only on workflow_dispatch with release input)
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    needs: build-debug-apk

    steps:
      - name: Checkout isotope-apk
        uses: actions/checkout@v4
        with:
          path: isotope-apk

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: isotope-apk/package-lock.json

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        working-directory: isotope-apk
        run: npm ci

      - name: Run regression tests
        working-directory: isotope-apk
        run: npm test

      - name: Apply patches and sync Capacitor Android
        working-directory: isotope-apk
        env:
          WWW_DIR: ${{ github.workspace }}/isotope-apk/www
          ANDROID_DIR: ${{ github.workspace }}/isotope-apk/android
        run: |
          node scripts/apply-android-patches.js
          npx cap sync android
          node scripts/apply-android-patches.js

      - name: Make Gradle executable
        working-directory: isotope-apk/android
        run: chmod +x gradlew

      - name: 🔑 Configure release signing (from GitHub secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "KEYSTORE_FILE=${PWD}/android/app/release.keystore"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "✅ Release keystore configured"
          else
            echo "❌ ANDROID_KEYSTORE_BASE64 secret not set — cannot sign release AAB"
            exit 1
          fi

      - name: Build Release AAB
        working-directory: isotope-apk/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: IsotopeAI-release-aab-${{ github.run_number }}
          path: isotope-apk/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
