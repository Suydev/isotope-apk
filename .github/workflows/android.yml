name: Build Android APK

on:
  push:
    branches: [main, codex/android-production-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout this repo (Capacitor wrapper + bridge + prebuilt www/) ──────
      - name: Checkout isotope-apk
        uses: actions/checkout@v4
        with:
          path: isotope-apk

      # ── Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: isotope-apk/package-lock.json

      # ── Java setup ────────────────────────────────────────────────────────
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Build Tools & Platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── Install npm dependencies ──────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: isotope-apk
        run: npm ci

      # ── Bridge parity gate ────────────────────────────────────────────────
      # scripts/prepare-www.js treats the ROOT android-bridge.js as the source and
      # copies it into www/. The test suite also reads the root copy. CI used to
      # silently `cp www/… root/…` before testing, which meant a commit that
      # edited only one copy still went green while the APK shipped the other —
      # so drift was invisible until a device runtime bug. Fail loudly instead.
      - name: Verify bridge copies are identical
        working-directory: isotope-apk
        run: |
          for f in android-bridge.js android-floating-timer-bridge.js; do
            if ! diff -q "$f" "www/$f" >/dev/null 2>&1; then
              echo "::error::$f differs from www/$f — both copies must be committed in sync (prepare-www.js copies root -> www/)"
              diff -u "$f" "www/$f" | head -40 || true
              exit 1
            fi
            echo "✓ $f matches www/$f"
          done

      # Correctness lint: no-undef is the gate that would have caught
      # refreshStoredSessionIfNeeded() before it shipped (ISSUE-035).
      - name: Lint (correctness rules)
        working-directory: isotope-apk
        run: npm run lint

      - name: Run regression tests
        working-directory: isotope-apk
        run: npm test

      # ── Report www/ size (prebuilt, committed) ───────────────────────────
      - name: Report www/ size
        working-directory: isotope-apk
        run: |
          echo "=== www/ top-level ==="
          ls -lh www/
          echo ""
          echo "=== Total size ==="
          du -sh www/
          echo ""
          echo "=== index.html bridge injection check ==="
          head -10 www/index.html
          echo ""
          echo "=== Largest files ==="
          find www/ -type f -printf '%s %p\n' | sort -rn | head -20 | awk '{printf "%.1f MB  %s\n", $1/1024/1024, $2}'

      # ── Sync Capacitor ────────────────────────────────────────────────────
      - name: Sync Capacitor
        working-directory: isotope-apk
        run: npx cap sync android

      # ── Validate www/ JS syntax (fail build if any bundle is corrupted) ──────
      # Parses as ES modules where applicable. `node --check` alone parses in
      # script mode and accepted two corrupted stubs for months (see
      # scripts/validate-www-js.mjs).
      - name: Validate www/ JS syntax
        working-directory: isotope-apk
        run: node scripts/validate-www-js.mjs

      # ── Supabase tooling ──────────────────────────────────────────────────
      # Entry points that nothing imports, so a syntax error in one is caught by
      # no test. backup.sh must stay byte-identical to isotope-code's copy: they
      # diverged once, and that copy let `restore` infer its target from .env —
      # production.
      - name: Validate Supabase tooling
        working-directory: isotope-apk
        run: |
          set -euo pipefail
          for f in scripts/supabase-backup.mjs scripts/schema-dump.mjs \
                   scripts/job-runner.mjs scripts/backup-ui.mjs \
                   scripts/supabase-setup.mjs scripts/supabase-check.mjs \
                   scripts/check-ui-refs.mjs; do
            node --check "$f"
            echo "  ok $f"
          done
          bash -n backup.sh
          bash -n supabase.sh
          node scripts/check-ui-refs.mjs

      # ── Make Gradle executable ────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        working-directory: isotope-apk/android
        run: chmod +x gradlew

      # ── Build Debug APK ───────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: isotope-apk
        run: android/gradlew -p android assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      # ── Find and report APK ───────────────────────────────────────────────
      - name: Find APK and report size
        working-directory: isotope-apk
        run: |
          echo "=== Built APK(s) ==="
          find android -name "*.apk" -type f | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "  $size  $f"
          done

      # ── Upload APK artifact ───────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IsotopeAI-debug-${{ github.run_number }}
          path: isotope-apk/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── Upload build logs on failure ──────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            isotope-apk/android/app/build/reports/
            isotope-apk/android/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # Optional: release build (only on workflow_dispatch with release input)
  build-release-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    needs: build-debug-apk

    steps:
      - name: Checkout isotope-apk
        uses: actions/checkout@v4
        with:
          path: isotope-apk

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: isotope-apk/package-lock.json

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        working-directory: isotope-apk
        run: npm ci

      - name: Run regression tests
        working-directory: isotope-apk
        run: npm test

      - name: Sync Capacitor Android
        working-directory: isotope-apk
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: isotope-apk/android
        run: chmod +x gradlew

      - name: 🔑 Configure release signing (from GitHub secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "KEYSTORE_FILE=${PWD}/android/app/release.keystore"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "✅ Release keystore configured"
          else
            echo "❌ ANDROID_KEYSTORE_BASE64 secret not set — cannot sign release AAB"
            exit 1
          fi

      - name: Build Release AAB
        working-directory: isotope-apk/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: IsotopeAI-release-aab-${{ github.run_number }}
          path: isotope-apk/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
